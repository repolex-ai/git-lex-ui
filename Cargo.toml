[package]
name = "git-lex-ui"
version = "0.1.0"
edition = "2024"
description = "A front door to every git-lex repo on the machine"
license = "Unlicense"
repository = "https://github.com/repolex-ai/git-lex-ui"

[[bin]]
name = "git-lex-ui"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal", "net"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# http-only: every hop this binary makes is to 127.0.0.1. Pulling in a TLS
# stack would be weight with nothing to protect.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
open = "5"

[profile.release]
opt-level = 3
lto = "thin"
